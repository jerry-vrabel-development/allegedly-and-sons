name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Worker types are up to date
        run: |
          npm run cf-typegen
          git diff --exit-code -- src/worker-configuration.d.ts

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: Worker bundles for deploy (dry run)
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const t=require("./coverage/coverage-summary.json").total;console.log(`| Metric | Covered |\n| --- | --- |\n${["lines","statements","functions","branches"].map(k=>`| ${k} | ${t[k].pct}% |`).join("\n")}`)' >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    name: Browser tests (desktop, Android, iPhone)
    runs-on: ubuntu-latest
    # System libraries come from Ubuntu mirrors, which are sometimes slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      # Browsers are cached per Playwright version; system libraries can't be
      # cached, so those are installed every run.
      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit

      - name: Install system libraries for the browsers
        timeout-minutes: 20
        run: npx playwright install-deps chromium webkit

      - name: Browser tests with axe accessibility checks
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
