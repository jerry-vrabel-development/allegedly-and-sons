version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      lint-and-format:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "prettier"]
      test:
        patterns: ["vitest", "@vitest/*", "@cloudflare/vitest-plugin"]
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (checked 2026-11-09): tsc passes, but typescript-eslint
      # 8.72 refuses to run ("does not support TS 7.0"; peer range <6.1.0),
      # so lint would stop. Drop this once typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node follows the Node the shop runs (.nvmrc: 22). Newer majors
      # describe APIs Node 22 doesn't have. Move it with .nvmrc, by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
